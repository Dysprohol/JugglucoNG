# Fork APK build (Dysprohol/JugglucoNG).
#
# Builds an installable phone APK without the upstream signing secrets:
#  - libjuice submodule (native build does add_subdirectory(libjuice))
#  - NDK + CMake versions read from Common/build.gradle (scripts/dist/install-sdk.sh)
#  - vendor JNI .so files (gitignored) restored and checksum-verified from the
#    pinned upstream release APK (scripts/restore-build-inputs.sh); without them
#    the APK builds but sensors do not work
#  - release APK is signed with the repo's public everyone.keystore, so it will NOT
#    update an app installed from upstream releases (different certificate)
#  - debug APK has the .debug applicationId suffix and installs beside other copies
name: Build JugglucoNG APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which phone APK to build
        type: choice
        options: [release, debug, both]
        default: both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK and CMake
        run: scripts/dist/install-sdk.sh

      - name: Restore vendor JNI libraries from pinned upstream release
        run: scripts/restore-build-inputs.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone APK
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          tasks=()
          case "$VARIANT" in
            release) tasks=(:Common:assembleMobileRelease) ;;
            debug)   tasks=(:Common:assembleMobileDebug) ;;
            *)       tasks=(:Common:assembleMobileRelease :Common:assembleMobileDebug) ;;
          esac
          ./gradlew "${tasks[@]}" -PjugglucoAbi=arm64-v8a,armeabi-v7a --stacktrace
          find Common/build/outputs/apk -name '*.apk' -exec ls -l {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JugglucoNG-APK
          path: Common/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
